server:
  http_listen_port: 9080
  grpc_listen_port: 0

clients:
  - url: http://loki:3100/loki/api/v1/push

positions:
  filename: /tmp/promtail-positions.yaml

scrape_configs:
  - job_name: "prompt-filter-logs"
    static_configs:
      - targets:
          - localhost
        labels:
          job: "prompt-filter"
          service: "filtering"
          __path__: /var/log/prompt-filter/filtering/*.jsonl

    pipeline_stages:
      - json:
          expressions:
            timestamp: ts
            request_id: request_id
            decision: decision
            risk_score: risk_score
            latency_ms: latency_ms
      - labels:
          request_id:
          decision:
      - timestamp:
          source: timestamp
          format: RFC3339Nano

  - job_name: "prompt-filter-localllm-logs"
    static_configs:
      - targets:
          - localhost
        labels:
          job: "prompt-filter"
          service: "localllm"
          __path__: /var/log/prompt-filter/localllm/*.jsonl

    pipeline_stages:
      - json:
          expressions:
            timestamp: ts
            request_id: request_id
            model: model
            latency_ms: latency_ms
      - labels:
          request_id:
          model:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
